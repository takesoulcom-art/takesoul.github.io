<style>
:root{--bg:#fafbfb;--ink:#222;--mid:#666;--lo:#999;--line:#bbb;--dot:#5b95e8;--sel:#cfe0fb;--logo:#a00014}
:root[data-tone=dark]{color-scheme:dark;--bg:#262624;--ink:#faf9f5;--mid:#c2c0b6;--lo:#8a887f;--line:#43423e;--dot:#6fa3f2;--sel:#3b4a63;--logo:#e5533d}
:root[data-tone=note]{--bg:#f3ebd4;--paper:#fbf6e3;--ink:#3b3226;--mid:#6b5f4c;--lo:#a09580;--line:#d2c6a6;--rule:#e8dfc0;--dot:#4f86d9;--sel:#ecd99a}
:root[data-tone=note] article,:root[data-tone=note] .act,:root[data-tone=note] #mbox{background:var(--paper)}
:root[data-tone=note] .tx{line-height:26px;background-image:repeating-linear-gradient(transparent 0,transparent 25px,var(--rule) 25px,var(--rule) 26px)}
:root[data-tone=dark] #modal{background:rgba(0,0,0,.5)}
.row2{display:flex;align-items:center;gap:14px;margin:6px 0}
.row2>span:first-child{width:76px;flex:none;color:var(--lo)}
.row2 input{flex:1;min-width:0}
.row2 button{color:var(--mid)}
.row2 button.on{color:var(--ink);font-weight:600}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.7 "Noto Sans KR",system-ui,sans-serif;height:100dvh;overflow:hidden}
button,input,textarea{font:inherit;color:inherit;background:none;border:0;padding:0}
button{cursor:pointer}
input[type=checkbox]{width:12px;height:12px;margin:0 4px 0 0;padding:0;vertical-align:middle;accent-color:var(--mid)}
input,textarea{border:1px solid var(--line);padding:4px 8px;width:100%}
.wrap{max-width:1100px;height:100dvh;margin:0 auto;padding:24px 20px;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:16px;padding:12px 0 8px;border-bottom:1px solid var(--line)}
#logo{flex:1;color:var(--logo);font-size:20px;letter-spacing:.5px}
#logo img{height:27px;display:block}
#logo a{display:inline-block;vertical-align:top;color:inherit;text-decoration:none}
#logo a[data-t]::before{content:attr(data-t)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#music{display:flex;align-items:center;gap:10px;color:var(--mid)}
#music button{color:var(--mid);display:flex;align-items:center;padding:6px 4px}
#music svg{display:block}
#menu{font-size:20px;color:var(--mid)}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.25);align-items:center;justify-content:center;z-index:9}
#mbox{background:var(--bg);border:1px solid var(--line);padding:20px 24px;width:min(340px,90vw);max-height:80vh;overflow:auto}
#mbox .row{display:flex;gap:8px;padding:2px 0;color:var(--mid);cursor:pointer;align-items:center}
#mbox .row.on{color:var(--ink);font-weight:600}
#mbox .mh{text-align:right;font-weight:700;color:var(--ink);margin-bottom:12px}
#mbox .bar{display:flex;gap:12px;margin-top:14px;color:var(--mid)}
#mbox input[type=password]{margin-bottom:4px}
main{flex:1;min-height:0;display:grid;grid-template-columns:320px 1fr;grid-template-rows:minmax(0,1fr);gap:32px;margin-top:24px}
aside{display:flex;flex-direction:column;gap:24px;overflow-y:auto;min-height:0}
.cal-h{display:flex;align-items:center;justify-content:space-between;font-size:16px;letter-spacing:1px}
.cal-h{display:block}
.ch{display:flex;align-items:center;justify-content:space-between}
.ch{padding-right:12px}
.ch>span{display:flex;align-items:center}
.ch>span:first-child{margin-left:-8px;gap:6px}
.ch button{font-size:16px;letter-spacing:1px}
.ch [data-a=py],.ch [data-a=pm]{padding:10px 10px}
.ch [data-a=prev],.ch [data-a=next]{font-size:26px;line-height:1;padding:6px 16px;letter-spacing:0}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.pk button{padding:4px 0;color:var(--mid)}
.pk .on{color:var(--ink);background:var(--sel)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;margin-top:16px;row-gap:10px;font-size:12px}
.cal .w{color:var(--lo);font-size:11px}
.d{height:30px;line-height:24px;position:relative;color:var(--mid)}
.d.has{cursor:pointer;color:var(--ink)}
.d.has::after{content:"";position:absolute;left:50%;bottom:0;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--dot)}
.d.sel span{background:var(--sel);display:inline-block;width:26px;height:26px;line-height:26px;border-radius:50%}
.tags{border-top:1px solid var(--line);padding-top:16px}
.tags h4{margin:0 0 8px;font-weight:400;display:flex;justify-content:space-between}
.tag{display:flex;gap:6px;color:var(--mid);padding:2px 0;cursor:pointer}
.tag.on{color:var(--ink);font-weight:600}
article{font-family:"Noto Serif KR",serif;border:1px solid var(--line);padding:36px 40px;overflow-y:auto;min-height:0;position:relative}
.meta{color:var(--lo);font-size:12px;letter-spacing:1px}
h2{font-weight:400;font-size:20px;margin:12px 0 28px}
.body{white-space:pre-wrap;font-family:"Noto Serif KR",serif;line-height:1.95;color:var(--mid)}
.tx{white-space:pre-wrap}
.body img{display:block;max-width:100%;margin:16px 0}
.act{position:sticky;top:6px;float:right;margin:-28px -32px 0 0;display:flex;gap:10px;color:var(--mid);background:var(--bg);z-index:2}
.plist div{padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.plist small{color:var(--lo);margin-right:10px}
.ed{display:flex;flex-direction:column;gap:8px;margin-top:20px}
.ed textarea{min-height:300px;font-family:"Noto Serif KR",serif}
.chip{display:inline-flex;gap:4px;margin-right:10px;color:var(--mid)}
.hide{display:none!important}
@media(max-width:760px){
body{height:auto;overflow:auto}.wrap{height:auto;display:block;padding:8px 14px 48px}header{position:sticky;top:0;background:var(--bg);z-index:5}.act{margin:-12px -12px 0 0}
main{display:grid;grid-template-columns:1fr;grid-template-rows:none;gap:44px}
article{order:1;padding:20px;overflow:visible}aside{overflow:visible;gap:44px}.tags{padding-top:24px}
aside{order:2}
header{flex-wrap:wrap}#menu{order:2}#music{order:3;flex-basis:100%;min-width:0;justify-content:flex-end;padding-bottom:4px}#music [data-a=mtoggle]{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
</style>

<body>
<div class="wrap">
<h1 class="sr">takesoul · 변재신 · janners</h1>
<header>
  <div id="logo"><a href="./" data-a="home"><img id="logoimg" alt="LOGO"></a></div>
  <div id="music"></div>
  <button id="menu" data-a="menu" aria-label="menu">≡</button>
</header>
<div id="modal"><div id="mbox"></div></div>
<main>
  <aside>
    <section><div class="cal-h" id="calh"></div><div class="cal" id="cal"></div></section>
    <section class="tags" id="tags"></section>
  </aside>
  <article id="art"></article>
</main>
</div>
<audio id="au"></audio>
<script>
// ---- 설정: 비워두면 주소(user.github.io/repo)에서 자동 추정 ----
const CFG={owner:'takesoulcom-art',repo:'takesoul.github.io',branch:'',gate:'eb58deb26c6708ffd17ef704ea31045c177fccba638f133d70545847a708ac88'};
const O=CFG.owner||location.hostname.split('.')[0];
const R=CFG.repo||location.pathname.split('/')[1]||O+'.github.io';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const S={posts:[],tags:{order:[],hidden:[]},music:[],y:0,m:0,date:null,tag:null,pid:null,mode:'view',key:sessionStorage.gk||'',admin:!!sessionStorage.gk,editTags:false,mOpen:false,cur:-1,playing:false,draft:null};
const au=$('#au');
const WD=['일','월','화','수','목','금','토'];
const sv=p=>`<svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true"><path d="${p}"/></svg>`;
const IC={play:sv('M4 2.5v11l9-5.5z'),pause:sv('M4 2.5h3v11H4zM9 2.5h3v11H9z'),next:sv('M3 2.5v11l7-5.5zM11 2.5h2.2v11H11z')};

// ---- GitHub API ----
const api=(p,o={})=>fetch(`https://api.github.com/repos/${O}/${R}/contents/${p}`+(CFG.branch&&!o.method?`?ref=${CFG.branch}`:''),{...o,headers:{Authorization:'Bearer '+S.key,Accept:'application/vnd.github+json'},cache:'no-store'});
const b64=s=>btoa(unescape(encodeURIComponent(s)));
async function put(p,content){ // content: base64
  const g=await api(p);const sha=g.ok?(await g.json()).sha:undefined;
  const r=await api(p,{method:'PUT',body:JSON.stringify({message:'update '+p,content,sha,branch:CFG.branch||undefined})});
  if(!r.ok)throw new Error((await r.json()).message);
}
async function del(p){
  const g=await api(p);if(!g.ok)return;
  await api(p,{method:'DELETE',body:JSON.stringify({message:'delete '+p,sha:(await g.json()).sha,branch:CFG.branch||undefined})});
}
const saveJSON=(p,o)=>put(p,b64(JSON.stringify(o,null,1)));
const savePosts=()=>saveJSON('data/index.json',S.posts);
const saveTags=()=>saveJSON('data/tags.json',S.tags);
const saveMusic=()=>saveJSON('data/music.json',S.music);
const load=async(f,d)=>{
  if(S.admin){try{const r=await fetch(`https://api.github.com/repos/${O}/${R}/contents/${f}`,{headers:{Authorization:'Bearer '+S.key,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok)return JSON.parse(await r.text());if(r.status==404)return d}catch(e){}}
  try{const r=await fetch(f+'?t='+Date.now());return r.ok?await r.json():d}catch(e){return d}
};
const reload=async()=>{S.full={};[S.posts,S.tags,S.music]=await Promise.all([load('data/index.json',[]),load('data/tags.json',{order:[],hidden:[]}),load('data/music.json',[])])};
const busy=async fn=>{try{await fn()}catch(e){alert('저장 실패: '+e.message)}};

// ---- 데이터 계산 ----
const vis=()=>S.posts.filter(p=>!p.hidden).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
const list=()=>S.admin?[...S.posts].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)):vis();
function tagList(all){
  const c={};vis().forEach(p=>(p.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  S.posts.forEach(p=>(p.tags||[]).forEach(t=>c[t]=c[t]||0));
  let names=Object.keys(c).sort((a,b)=>c[b]-c[a]);
  const o=S.tags.order.filter(t=>names.includes(t));
  names=[...o,...names.filter(t=>!o.includes(t))];
  return names.filter(t=>all||!S.tags.hidden.includes(t)).map(t=>[t,c[t]]);
}

// ---- 렌더링 ----
function renderCal(){
  const has=new Set(vis().map(p=>p.date));
  const y0=Math.min(2026,S.y),y1=Math.max(2026,new Date().getFullYear(),S.y),yrs=[];
  for(let y=y0;y<=y1;y++)yrs.push(y);
  const pk=S.pick=='y'?`<div class="pk">${yrs.map(y=>`<button class="${y==S.y?'on':''}" data-a="sy" data-v="${y}">${y}</button>`).join('')}</div>`
    :S.pick=='m'?`<div class="pk">${[...Array(12)].map((_,i)=>`<button class="${i==S.m?'on':''}" data-a="sm" data-v="${i}">${i+1}</button>`).join('')}</div>`:'';
  $('#calh').innerHTML=`<div class="ch"><span><button data-a="py">${S.y}</button> <button data-a="pm">${String(S.m+1).padStart(2,'0')}</button></span>
  <span><button data-a="prev">‹</button><button data-a="next">›</button></span></div>${pk}`;
  const first=new Date(S.y,S.m,1).getDay(),n=new Date(S.y,S.m+1,0).getDate();
  let h=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(w=>`<div class="w">${w}</div>`).join('');
  for(let i=0;i<first;i++)h+='<div></div>';
  for(let d=1;d<=n;d++){
    const ds=`${S.y}-${String(S.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    h+=`<div class="d ${has.has(ds)?'has':''} ${S.date==ds?'sel':''}" ${has.has(ds)?`data-a="day" data-v="${ds}"`:''}><span>${d}</span></div>`;
  }
  $('#cal').innerHTML=h;
}
function renderTags(){
  let h=`<h4><span>Tags</span>${S.admin?`<button data-a="tedit">${S.editTags?'완료':'Edit'}</button>`:''}</h4>`;
  const L=tagList(S.admin&&S.editTags);
  h+=L.map(([t,n],i)=>S.editTags
    ?`<div class="tag"><input type="checkbox" data-a="thide" data-v="${esc(t)}" ${S.tags.hidden.includes(t)?'checked':''} title="숨김"> # ${esc(t)} (${n})
      <button data-a="tup" data-v="${i}">↑</button><button data-a="tdn" data-v="${i}">↓</button></div>`
    :`<div class="tag ${S.tag==t?'on':''}" data-a="tag" data-v="${esc(t)}"># ${esc(t)} (${n})</div>`).join('');
  $('#tags').innerHTML=h||'<h4>Tags</h4>';
}
S.blob={};S.up=[];S.full={};
async function loadPost(id){if(S.full[id])return S.full[id];const p=await load(`data/${id.slice(0,4)}/${id}.json`,null);return S.full[id]=p||{body:'글 파일을 찾을 수 없습니다. 배포 중이면 잠시 후 새로고침해 주세요.',_x:1}}
async function imgFix(i){if(!S.admin||i.dataset.f)return;i.dataset.f=1;try{const r=await fetch(`https://api.github.com/repos/${O}/${R}/contents/${i.dataset.p}`,{headers:{Authorization:'Bearer '+S.key,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok){S.blob[i.dataset.p]=URL.createObjectURL(await r.blob());i.src=S.blob[i.dataset.p]}}catch(e){}}
const imgsOf=b=>[...String(b||'').matchAll(/!\[[^\]]*\]\(([^)]+)\)/g)].map(m=>m[1]);
const purge=async(c,keep)=>{for(const p of new Set(c))if(!keep.has(p))await del(p).catch(()=>{})};
function body(t){
  const parts=String(t).split(/(!\[[^\]]*\]\([^)]+\))/),last=parts.length-1;
  return parts.map((x,i)=>{
    const m=x.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
    if(m)return `<img src="${S.blob[m[2]]||m[2]}" data-p="${esc(m[2])}" alt="${esc(m[1])}" onerror="imgFix(this)">`;
    if(i>0)x=x.replace(/^\n/,'');if(i<last)x=x.replace(/\n$/,'');
    return x?`<div class="tx">${esc(x)}</div>`:'';
  }).join('');
}
function renderArt(){
  const a=$('#art');
  const acts=S.admin?`<div class="act">${S.mode=='view'&&S.pid?'<button data-a="edit">[수정]</button><button data-a="delpost">[삭제]</button>':''}${S.mode=='view'?'<button data-a="new">[글쓰기]</button>':''}</div>`:'';
  if(S.mode=='edit'){
    const d=S.draft,imgs=[...d.body.matchAll(/!\[([^\]]*)\]\(([^)]+)\)/g)];
    a.innerHTML=`<div class="ed">
      <input id="e-date" type="date" value="${d.date}">
      <input id="e-title" placeholder="제목" value="${esc(d.title)}">
      <input id="e-tags" placeholder="Tags (쉼표로 구분, 예: 일상, 생각)" value="${esc((d.tags||[]).join(', '))}">
      <textarea id="e-body" placeholder="본문">${esc(d.body)}</textarea>
      <div><button data-a="imgs">[이미지 관리 (${imgs.length})]</button></div>
      <label><input type="checkbox" id="e-hid" style="width:auto" ${d.hidden?'checked':''}> 숨김</label>
      <div><button data-a="save">[저장]</button> <button data-a="cancel">[취소]</button></div></div>`;
    return;
  }
  let posts=S.tag?list().filter(p=>(p.tags||[]).includes(S.tag)):null;
  if(S.tag&&!S.pid){
    a.innerHTML=acts+`<div class="meta"># ${esc(S.tag)}</div><div class="plist" style="margin-top:16px">`+
      (posts.map(p=>`<div data-a="open" data-v="${p.id}"><small>${p.date}</small>${esc(p.title)}</div>`).join('')||'글이 없습니다.')+'</div>';
    return;
  }
  let p=S.posts.find(x=>x.id==S.pid);
  if(!p){
    const day=S.date?list().filter(x=>x.date==S.date):list();
    if(day.length>1&&S.date){
      a.innerHTML=acts+`<div class="meta">${S.date}</div><div class="plist" style="margin-top:16px">`+day.map(x=>`<div data-a="open" data-v="${x.id}">${esc(x.title)}</div>`).join('')+'</div>';return;
    }
    p=day[0];
  }
  if(!p){a.innerHTML=acts+'<div class="meta">아직 작성된 글이 없습니다.</div>';return}
  S.pid=p.id;setHash(p.id);
  const fp=S.full[p.id];
  if(!fp){a.innerHTML='<div class="meta">불러오는 중…</div>';loadPost(p.id).then(()=>{if(S.pid==p.id&&S.mode=='view')renderArt()});return}
  p={...p,body:fp.body};track(p);
  const dt=new Date(p.date+'T00:00');
  a.innerHTML=(S.admin?`<div class="act"><button data-a="edit">[수정]</button><button data-a="delpost">[삭제]</button><button data-a="new">[글쓰기]</button></div>`:'')+
    `<div class="meta">${p.date.replace(/-/g,'. ')} ${WD[dt.getDay()]}요일${p.hidden?' · 숨김':''}</div><h2>${esc(p.title)}</h2><div class="body">${body(p.body)}</div>`;
}
function renderMusic(){
  const m=$('#music');
  if(!S.music.length){
    m.innerHTML=S.admin?'<button data-a="mtoggle">음악 관리</button>':'';
  }else{
    const t=S.music[S.cur>=0?S.cur:0].name;
    m.innerHTML=`<button data-a="mtoggle">♬ ${esc(t)}</button><button data-a="play" aria-label="${S.playing?'정지':'재생'}">${S.playing?IC.pause:IC.play}</button><button data-a="nextm" aria-label="다음곡">${IC.next}</button>`;
  }
  if(S.modal=='music'){const ck=[...document.querySelectorAll('.mck')].map(c=>c.checked);renderModal();document.querySelectorAll('.mck').forEach((c,i)=>c.checked=!!ck[i])}
}
function musicHTML(){
  return '<div class="mh">요즘 듣는 음악</div>'+S.music.map((t,i)=>`<div class="row ${i==S.cur?'on':''}" data-a="song" data-v="${i}">${S.admin?`<input type="checkbox" class="mck" data-i="${i}" style="width:auto" onclick="event.stopPropagation()">`:''}${esc(t.name)}</div>`).join('')+
    `<div class="bar">${S.admin?`<label style="cursor:pointer">[업로드]<input type="file" id="m-up" accept="audio/*" multiple class="hide"></label><button data-a="mdel">[삭제]</button><button data-a="mup">▲</button><button data-a="mdn">▼</button>`:''}<button data-a="mtoggle">[닫기]</button></div>`;
}
const render=()=>{renderCal();renderTags();renderArt();renderMusic()};

// ---- 음악 ----
function playIdx(i){
  if(!S.music.length)return;
  S.cur=(i+S.music.length)%S.music.length;
  const f=S.music[S.cur].file;au.src=S.blob[f]||encodeURI(f);au.play().catch(()=>{});S.playing=true;renderMusic();
}
au.onended=()=>playIdx(S.cur+1);
au.onerror=async()=>{const f=S.music[S.cur]&&S.music[S.cur].file;
  if(S.admin&&f&&!S.blob[f]){try{const r=await fetch(`https://api.github.com/repos/${O}/${R}/contents/${f}`,{headers:{Authorization:'Bearer '+S.key,Accept:'application/vnd.github.raw+json'},cache:'no-store'});if(r.ok){S.blob[f]=URL.createObjectURL(await r.blob());au.src=S.blob[f];au.play().catch(()=>{});return}}catch(e){}}
  S.playing=false;renderMusic()};

const syncDraft=()=>{const g=i=>$('#'+i);Object.assign(S.draft,{date:g('e-date').value,title:g('e-title').value,body:g('e-body').value,tags:g('e-tags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean),hidden:g('e-hid').checked})};
function renderModal(){
  const w=$('#modal'),b=$('#mbox'),k=S.modal;
  w.style.display=k?'flex':'none';if(!k)return;
  const X='<button data-a="mclose">[닫기]</button>';let h='';
  if(k=='auth'){const cur=document.documentElement.dataset.tone;
    h=`<div class="row2"><span>Tone</span>${['white','dark','note'].map(t=>`<button class="${t==cur?'on':''}" data-a="tone" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div><div class="row2" id="krow"><span>관리자 모드</span><button data-a="${S.admin?'logout':'kinput'}">${S.admin?'[로그아웃]':'[입력]'}</button></div>`}
  else if(k=='y'){const y1=Math.max(2026,new Date().getFullYear(),S.y),a=[];for(let y=Math.min(2026,S.y);y<=y1;y++)a.push(y);
    h=`<div class="pk">${a.map(y=>`<button class="${y==S.y?'on':''}" data-a="sy" data-v="${y}">${y}</button>`).join('')}</div>`}
  else if(k=='m')h=`<div class="pk">${[...Array(12)].map((_,i)=>`<button class="${i==S.m?'on':''}" data-a="sm" data-v="${i}">${i+1}</button>`).join('')}</div>`;
  else if(k=='tags')h='<div class="meta">체크한 Tags는 숨김</div>'+tagList(true).map(([t,n],i)=>`<div class="row"><input type="checkbox" data-a="thide" data-v="${esc(t)}" ${S.tags.hidden.includes(t)?'checked':''}># ${esc(t)} (${n}) <button data-a="tup" data-v="${i}">↑</button><button data-a="tdn" data-v="${i}">↓</button></div>`).join('')+'<div class="bar"><button data-a="tdone">[완료]</button></div>';
  else if(k=='img')h='<div class="meta">x로 지운 이미지는 [저장] 시 저장소에서도 삭제됩니다</div><label style="cursor:pointer">[이미지 업로드]<input type="file" id="e-img" accept="image/*" multiple class="hide"></label>'+[...S.draft.body.matchAll(/!\[([^\]]*)\]\(([^)]+)\)/g)].map(m=>`<div class="row">${esc(m[1])} <button data-a="rmimg" data-v="${esc(m[0])}">x</button></div>`).join('')+`<div class="bar">${X}</div>`;
  else if(k=='music')h=musicHTML();
  b.innerHTML=h;
  const f=b.querySelector('input:not([type=checkbox]):not([type=file])');if(f)f.focus();
}
const toTop=()=>{$('#art').scrollTop=0;window.scrollTo(0,0)};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fld=d=>JSON.stringify([d.date,d.title,d.body,(d.tags||[]).join(','),!!d.hidden]);
const getDraft=()=>{try{return JSON.parse(localStorage.draft||'null')}catch(e){return null}};
const dropDraft=()=>{try{localStorage.removeItem('draft')}catch(e){}};
const dirty=()=>{if(S.mode!='edit'||!$('#e-body'))return false;syncDraft();return fld(S.draft)!=S.snap};
const leave=()=>!dirty()||confirm('저장하지 않은 내용이 있습니다. 나갈까요?');
const setHash=id=>{if(location.hash.slice(1)==id)return;(S.hs?history.pushState:history.replaceState).call(history,null,'','#'+id);S.hs=1};
window.addEventListener('beforeunload',e=>{if(dirty()){e.preventDefault();e.returnValue=''}});
document.addEventListener('input',e=>{if(S.mode=='edit'&&e.target.closest('.ed')){try{syncDraft();localStorage.draft=JSON.stringify(S.draft)}catch(x){}}});
window.addEventListener('popstate',()=>{const p=S.posts.find(x=>x.id==location.hash.slice(1)&&(S.admin||!x.hidden));if(!p||(S.mode=='edit'&&!leave()))return;
  Object.assign(S,{tag:null,pid:p.id,date:p.date,mode:'view',modal:null});const d=new Date(p.date+'T00:00');S.y=d.getFullYear();S.m=d.getMonth();render();renderModal();toTop()});
// ---- 이벤트 ----
const go=(y,m)=>{const d=new Date(y,m,1);S.y=d.getFullYear();S.m=d.getMonth();S.modal=null;renderCal();renderModal()};
const pick=(o)=>Object.assign(S,{date:null,tag:null,pid:null,mode:'view'},o);
const mvt=(i,d)=>{const L=tagList(true).map(x=>x[0]);const j=i+d;if(j<0||j>=L.length)return;[L[i],L[j]]=[L[j],L[i]];S.tags.order=L;renderModal()};
const mvm=async d=>{if(S.lock)return;const i=[...document.querySelectorAll('.mck')].findIndex(c=>c.checked);if(i<0)return;const j=i+d;if(j<0||j>=S.music.length)return;
  S.lock=1;const cf=S.cur>=0?S.music[S.cur].file:null;
  [S.music[i],S.music[j]]=[S.music[j],S.music[i]];if(cf)S.cur=S.music.findIndex(t=>t.file==cf);
  await busy(saveMusic);S.lock=0;renderMusic();document.querySelectorAll('.mck').forEach((c,k)=>c.checked=k==j)};

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a,v=el.dataset.v;
  if(['day','tag','open','home'].includes(a)&&S.mode=='edit'&&!leave()){e.preventDefault();return}
  if(a=='menu'){S.modal='auth';S.mstep=S.admin?'out':'pw';renderModal()}
  else if(a=='logout'){delete sessionStorage.gk;location.reload()}
  else if(a=='py'||a=='pm'){S.modal=a[1];renderModal()}
  else if(a=='sy')go(+v,S.m);
  else if(a=='sm')go(S.y,+v);
  else if(a=='home'){e.preventDefault();const v=vis()[0];Object.assign(S,{tag:null,pid:v?v.id:null,date:v?v.date:null,mode:'view',modal:null});const d=v?new Date(v.date+'T00:00'):new Date();S.y=d.getFullYear();S.m=d.getMonth();render();renderModal();toTop()}
  else if(a=='prev')go(S.y,S.m-1);
  else if(a=='next')go(S.y,S.m+1);
  else if(a=='day'){pick({date:v});S.pid=null;render();toTop()}
  else if(a=='tag'){pick({tag:v});render();toTop()}
  else if(a=='open'){S.pid=v;S.mode='view';const p=S.posts.find(x=>x.id==S.pid);if(p){S.date=p.date;const d=new Date(p.date+'T00:00');S.y=d.getFullYear();S.m=d.getMonth()}renderArt();renderCal();toTop()}
  else if(a=='new'){let d={date:today(),title:'',body:'',tags:[],hidden:false};S.snap=fld(d);const sv=getDraft();if(sv&&!sv.id&&confirm('작성 중이던 글이 있습니다. 이어서 쓸까요?'))d=sv;S.draft=d;S.up=[];S.mode='edit';renderArt()}
  else if(a=='edit'){const f=S.full[S.pid];if(!f||f._x)return;let d={...f};S.snap=fld(d);const sv=getDraft();if(sv&&sv.id==f.id&&confirm('저장하지 않은 수정 내용이 있습니다. 이어서 쓸까요?'))d=sv;S.draft=d;S.up=[];S.mode='edit';renderArt()}
  else if(a=='cancel'){if(!leave())return;dropDraft();await busy(()=>purge(S.up,new Set(imgsOf((S.full[S.draft.id]||{}).body))));S.up=[];S.mode='view';renderArt()}
  else if(a=='rmimg'){syncDraft();S.draft.body=S.draft.body.replace(v,'');renderArt();renderModal()}
  else if(a=='save'){
    const d={...S.draft,date:$('#e-date').value,title:$('#e-title').value.trim(),body:$('#e-body').value,
      tags:$('#e-tags').value.split(',').map(s=>s.trim().replace(/^#/,'')).filter(Boolean),hidden:$('#e-hid').checked};
    if(!d.title||!d.date||!d.tags.length){alert('날짜, 제목, Tags는 필수입니다.');return}
    const base=await load('data/index.json',S.posts),pre=d.date.replace(/-/g,'');
    if(!d.id){const n=Math.max(0,...base.filter(x=>x.id.startsWith(pre)).map(x=>+x.id.slice(8)))+1;d.id=pre+String(n).padStart(2,'0')}
    const m={id:d.id,date:d.date,title:d.title,tags:d.tags,hidden:d.hidden},old=(S.full[d.id]||{}).body||'';
    try{
      await put(`data/${d.id.slice(0,4)}/${d.id}.json`,b64(JSON.stringify({...m,body:d.body},null,1)));
      const arr=[...base],i=arr.findIndex(x=>x.id==d.id);i<0?arr.push(m):arr[i]=m;
      await saveJSON('data/index.json',arr);S.posts=arr;S.full[d.id]={...m,body:d.body};
      await purge([...imgsOf(old),...S.up],new Set(imgsOf(d.body)));
    }catch(e){alert('저장 실패: '+e.message);return}
    dropDraft();S.up=[];S.mode='view';S.pid=d.id;S.date=d.date;S.tag=null;
    const dt=new Date(d.date+'T00:00');S.y=dt.getFullYear();S.m=dt.getMonth();render();
  }
  else if(a=='delpost'){if(!confirm('이 글을 삭제할까요?'))return;
    const id=S.pid,fp=await loadPost(id),gone=imgsOf(fp&&fp.body);
    try{const arr=(await load('data/index.json',S.posts)).filter(x=>x.id!=id);await saveJSON('data/index.json',arr);S.posts=arr;delete S.full[id];
      await del(`data/${id.slice(0,4)}/${id}.json`);await purge(gone,new Set())}catch(e){alert('삭제 실패: '+e.message);return}
    pick({});render()}
  else if(a=='tedit'){S.modal='tags';renderModal()}
  else if(a=='tdone'){await busy(saveTags);S.modal=null;render()}
  else if(a=='tone'){document.documentElement.dataset.tone=v;try{localStorage.tone=v}catch(e){}setLogo();renderModal()}
  else if(a=='kinput'){$('#krow').innerHTML='<span>관리자 모드</span><input id="pw" type="password" placeholder="관리자 코드" autocomplete="off"><button data-a="authok">[확인]</button>';$('#pw').focus()}
  else if(a=='mclose'){S.modal=null;renderModal()}
  else if(a=='imgs'){syncDraft();S.modal='img';renderModal()}
  else if(a=='tup')mvt(+v,-1);
  else if(a=='tdn')mvt(+v,1);
  else if(a=='thide'){const h=S.tags.hidden;e.target.checked?h.push(v):S.tags.hidden=h.filter(x=>x!=v)}
  else if(a=='mtoggle'){S.modal=S.modal=='music'?null:'music';renderModal()}
  else if(a=='play'){if(S.playing){au.pause();S.playing=false;renderMusic()}else if(S.cur<0)playIdx(0);else{au.play();S.playing=true;renderMusic()}}
  else if(a=='nextm')playIdx(S.cur+1);
  else if(a=='song')playIdx(+v);
  else if(a=='mdel'){if(S.lock)return;const ix=[...document.querySelectorAll('.mck')].filter(c=>c.checked).map(c=>+c.dataset.i);
    if(!ix.length||!confirm('선택한 곡을 삭제할까요?'))return;
    S.lock=1;const gone=ix.map(i=>S.music[i].file),cf=S.cur>=0?S.music[S.cur].file:null;
    S.music=S.music.filter((_,i)=>!ix.includes(i));
    await busy(async()=>{await saveMusic();for(const f of gone)await del(f).catch(()=>{})});
    S.lock=0;
    if(cf&&gone.includes(cf)){au.pause();au.removeAttribute('src');S.cur=-1;S.playing=false}else S.cur=cf?S.music.findIndex(t=>t.file==cf):-1;
    renderMusic()}
  else if(a=='mup')mvm(-1);
  else if(a=='mdn')mvm(1);
});

document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.c=='y')go(+t.value,S.m);
  if(t.dataset.c=='m')go(S.y,+t.value);
  const rd=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.readAsDataURL(f)});
  if(t.id=='e-img'){
    syncDraft();
    await busy(async()=>{for(const f of t.files){const p='img/'+(S.draft.date||new Date().toISOString()).slice(0,4)+'/'+Date.now()+'-'+f.name.replace(/[^\w.\-]/g,'_');
      S.blob[p]=URL.createObjectURL(f);S.up.push(p);await put(p,await rd(f));S.draft.body+=`\n![${f.name.replace(/\.[^.]+$/,'')}](${p})\n`}});
    renderArt();renderModal();
  }
  if(t.id=='m-up'){
    await busy(async()=>{try{for(const f of t.files){const p='music/'+f.name.replace(/[^\w.\-가-힣 ()\[\]]/g,'_');
      S.blob[p]=URL.createObjectURL(f);await put(p,await rd(f));
      const e={name:f.name.replace(/\.[^.]+$/,''),file:p},i=S.music.findIndex(m=>m.file==p);i<0?S.music.push(e):S.music[i]=e}}finally{await saveMusic()}});
    renderMusic();
  }
});

const msg=t=>{let m=$('#amsg');if(!m){m=document.createElement('span');m.id='amsg';m.style.color='var(--logo)';$('#mbox').appendChild(m)}m.textContent=t};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function authStep(){
  const pw=$('#pw'),gk=$('#gk');
  if(pw){
    if(await sha(pw.value.trim())!==CFG.gate){msg('코드가 맞지 않습니다.');return}
    $('#krow').innerHTML='<span>관리자 모드</span><input id="gk" type="password" placeholder="GitHub 키(토큰)" autocomplete="off"><button data-a="authok">[확인]</button>';$('#gk').focus();
  }else if(gk){
    const k=gk.value.replace(/\s/g,'');
    if(!k){msg('키를 입력하세요.');return}
    msg('확인 중… ('+O+'/'+R+')');
    try{
      const r=await fetch(`https://api.github.com/repos/${O}/${R}`,{headers:{Authorization:'Bearer '+k,Accept:'application/vnd.github+json'}});
      if(!r.ok){msg(`실패(${r.status}): 저장소 ${O}/${R} 또는 키 권한을 확인하세요. 주소가 다르면 코드 상단 CFG에 owner/repo를 적으세요.`);return}
      const j=await r.json();
      if(j.permissions&&j.permissions.push===false){msg('이 키에는 쓰기 권한이 없습니다. (Contents: Read and write 필요)');return}
      S.key=k;sessionStorage.gk=k;S.admin=true;S.modal=null;window['ga-disable-G-JC6PD25F8X']=true;await reload();render();
    }catch(err){msg('오류: '+err.message)}
  }
}
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.modal){S.modal=null;renderModal()}if(e.key=='Enter'&&e.target.closest('#mbox')){e.preventDefault();authStep()}});
document.addEventListener('click',e=>{if(e.target.closest('[data-a="authok"]'))authStep();if(e.target.id=='modal'){S.modal=null;renderModal()}});

function setLogo(){
  const i=$('#logoimg'),L=$('#logo a'),f={white:'logo.gif',dark:'logod.gif',note:'logon.gif'}[document.documentElement.dataset.tone]||'logo.gif';
  delete L.dataset.t;i.style.display='';
  i.onerror=()=>{if(!i.src.endsWith('/logo.gif'))i.src='logo.gif';else{i.style.display='none';L.dataset.t='LOGO'}};
  i.src=f;
}
setLogo();
// ---- 글을 열 때마다 조회 기록 (GA 코드는 <head>에 있음) ----
const track=p=>{if(S.lt!=p.id){S.lt=p.id;if(!S.admin)try{gtag('event','view_post',{post_id:p.id,post_title:p.title})}catch(e){}}};
// ---- 시작 ----
(async()=>{
  await reload();
  const hv=S.posts.find(x=>x.id==location.hash.slice(1)&&(S.admin||!x.hidden)),v=hv||vis()[0],d=v?new Date(v.date+'T00:00'):new Date();
  S.y=d.getFullYear();S.m=d.getMonth();if(v){S.pid=v.id;S.date=v.date}
  render();
})();
</script>
</body>
