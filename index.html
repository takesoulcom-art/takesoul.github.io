async function flushNow(msg,prog){
  if(!Q.size)return;
  const items=[...Q],done=()=>items.forEach(([p,v])=>{if(Q.get(p)===v)Q.delete(p)});
  const br=BR||BRN||(BRN=(await ghj('')).default_branch);
  const head=(await ghj(`/git/ref/heads/${br}`)).object.sha;
  const cm=await ghj(`/git/commits/${head}`);
  const tr=await ghj(`/git/trees/${cm.tree.sha}?recursive=1`);
  const have=new Set((tr.tree||[]).filter(x=>x.type=='blob').map(x=>x.path)),shaOf={};(tr.tree||[]).forEach(x=>{if(x.type=='blob')shaOf[x.path]=x.sha});
  const vs=await verStamp(items,tr,shaOf); // 같은 커밋에 넣을 버전 계산 (최신 ver.json 기준)
  const adds=items.filter(([,v])=>!v.d),ents=[];let n=0;
  for(const [p,v] of adds){
    if(prog)prog(++n,adds.length,p);
    if(v.mv){const sh=shaOf[v.mv];if(!sh)throw new Error('원본 파일을 찾지 못했어요: '+v.mv);ents.push({path:p,mode:'100644',type:'blob',sha:sh});continue}
    const bl=await ghj('/git/blobs',{method:'POST',body:JSON.stringify({content:v.b?await b64blob(v.b):b64(vs.txt.has(p)?vs.txt.get(p):v.t),encoding:'base64'})});
    ents.push({path:p,mode:'100644',type:'blob',sha:bl.sha});
  }
  if(vs.ver){const bl=await ghj('/git/blobs',{method:'POST',body:JSON.stringify({content:b64(JSON.stringify(vs.ver,null,1)),encoding:'base64'})});ents.push({path:VP,mode:'100644',type:'blob',sha:bl.sha})}
  items.forEach(([p,v])=>{if(v.d&&(tr.truncated||have.has(p)))ents.push({path:p,mode:'100644',type:'blob',sha:null})});
  if(!ents.length){done();return}
  const nt=await ghj('/git/trees',{method:'POST',body:JSON.stringify({base_tree:cm.tree.sha,tree:ents})});
  const nc=await ghj('/git/commits',{method:'POST',body:JSON.stringify({message:msg||'update',tree:nt.sha,parents:[head]})});
  await ghj(`/git/refs/heads/${br}`,{method:'PATCH',body:JSON.stringify({sha:nc.sha})});
  done();
}

const VP='data/ver.json',VK={'data/index.json':'index','data/tags.json':'tags','data/music.json':'music','data/design.json':'design'};
const isPost=p=>/^data\/\d{4}\/[^/]+\.json$/.test(p);

const vNext=prev=>Math.max(vNow(),(+prev||0)+1); // 항상 직전값보다 커서 같은 값이 다시 나오지 않음
async function verRead(tr,shaOf){ // 커밋 직전의 최신 ver.json (두 기기 동시 저장 대비). 없으면 {}
  const sh=shaOf[VP],dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/\s/g,'')))));
  try{
    if(sh)return dec((await ghj('/git/blobs/'+sh)).content);
    if(!tr.truncated)return {};
    const r=await ghRaw(VP);if(r.ok)return JSON.parse(await r.text());
    if(r.status==404)return {};throw new Error('HTTP '+r.status);
  }catch(e){throw new Error('ver.json 을 읽지 못했어요: '+e.message)}
}
async function verStamp(items,tr,shaOf){ // 저장 대상에 새 버전을 정해 내부 v 로 넣고, 바뀐 항목만 ver.json 에 반영
  const txt=new Map(),L=items.filter(([p,v])=>!v.d&&v.t!=null&&(VK[p]||isPost(p)));
  if(!L.length)return {txt,ver:null};
  let vj=await verRead(tr,shaOf);
  if(!vj.base){const b=vNow();vj={index:b,tags:b,music:b,design:b,base:b}} // 최초 1회: 버전표 새로 만들기(마이그레이션, 기존 파일은 그대로)

    const k=VK[p];if(k=='index')continue;
    const o=JSON.parse(v.t);delete o.v;
    if(k){const nv=vNext(vj[k]);vj[k]=nv;txt.set(p,JSON.stringify({v:nv,...o},null,1));continue}
    const id=p.split('/').pop().slice(0,-5),it=idx&&idx.find(x=>x.id==id);

// 방문자: ver.json 을 no-cache 로 확인(변경 없으면 304). 3초 안에 못 받으면 직전 사본, 사본도 없으면 null(→ 예전 ?t= 방식)
const DCN='data-v1',VL='verjson';
async function verGet(){
  let j=null;
  try{
    const ac=new AbortController(),t=setTimeout(()=>ac.abort(),3000);
    try{
      const r=await fetch(VP,{cache:'no-cache',signal:ac.signal});
      if(r.status==404){try{delete localStorage[VL]}catch(e){}return null}
      if(r.ok)j=await r.json();
    }finally{clearTimeout(t)}
  }catch(e){}
  if(j&&typeof j=='object'){try{localStorage[VL]=JSON.stringify(j)}catch(e){}return j}
  try{const s=JSON.parse(localStorage[VL]);if(s&&typeof s=='object')return s}catch(e){}
  return null;
}
const vBad=(j,v)=>!!j&&typeof j=='object'&&!Array.isArray(j)&&j.v!=null&&String(j.v)!=String(v); // 내부 v 가 있는 파일만 자기 검증
async function vfetch(u,o){try{const r=await fetch(u,o);if(r.status==404)return {nf:1};if(!r.ok)return null;return {j:await r.json()}}catch(e){return null}}
async function dcPut(c,f,key,j){ // 저장하고, 같은 파일의 이전 버전은 지움
  try{
    await c.put(key,new Response(JSON.stringify(j),{headers:{'Content-Type':'application/json'}}));
    const me=new URL(key,location.href).href;
    for(const k of await c.keys(f,{ignoreSearch:true}))if(k.url!=me)await c.delete(k);
  }catch(e){}
}
async function vload(f,v,d){ // 받아 둔 버전이면 요청 없이 Cache Storage 에서, 아니면 f?v=v 로 받기
  const key=f+'?v='+v;let c=null;
  try{c=await caches.open(DCN)}catch(e){}
  if(c){try{const r=await c.match(key);if(r){const j=await r.json();if(!vBad(j,v))return j;await c.delete(key)}}catch(e){}}
  let x=await vfetch(key);
  if(!x||x.nf)return d;
  if(vBad(x.j,v)){const y=await vfetch(key+'&t='+Date.now(),{cache:'no-store'});if(y&&y.j!==undefined)x=y} // CDN 지연: 한 번만 다시 받기

}
async function dcClean(){ // 삭제된 글과 이전 버전 정리 (목록을 못 읽었으면 건드리지 않음)

document.addEventListener('change',async e=>{

  else if(t.id=='u-logo'){const f=t.files[0];t.value='';if(f)await uiLogo(f)}

    const all=[...t.files],good=all.filter(f=>/\.(mp3|m4a|ogg)$/i.test(f.name));t.value='';
    const I=S.pend.items;let dup=0,over=0;const big=[];
    for(const f of good){
      if(f.size>MUSIC_MAX){big.push(f.name);continue}
      if(I.some(x=>x.f.name==f.name&&x.f.size==f.size)){dup++;continue}
      if(I.length>=30){over++;continue}
      const it={f,title:f.name.replace(/\.[^.]+$/,''),cv:null};I.push(it);
      embCover(f).then(b=>{if(!b||it.cv||!S.pend.items.includes(it))return;it.cv={file:b,url:URL.createObjectURL(b)};

    if(await sha(pw.value.trim())!==CFG.gate){msg('코드가 맞지 않습니다.');return}
    keyRow('gk','GitHub 키(토큰)');
    $('#krow').insertAdjacentHTML('afterend','<label class="row2"><span></span><span><input type="checkbox" id="keep">이 기기에서는 유지</span></label>');
  }else if(gk){
    const k=gk.value.replace(/\s/g,'');
    if(!k){msg('키를 입력하세요.');return}
    msg('확인 중… ('+O+'/'+R+')');
    try{
      const r=await ghRepo(k);
      if(!r.ok){msg(`실패(${r.status}): 저장소 ${O}/${R} 또는 키 권한을 확인하세요. 주소가 다르면 코드 상단 CFG에 owner/repo를 적으세요.`);return}
      const j=await r.json();
      if(j.permissions&&j.permissions.push===false){msg('이 키에는 쓰기 권한이 없습니다. (Contents: Read and write 필요)');return}
      S.key=k;keySave(k,$('#keep')&&$('#keep').checked);S.admin=true;closeModal();gaOff();await reload();render();
    }catch(err){msg('오류: '+err.message)}
  }
}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key=='Enter'||e.key==' ')&&t.id=='dz'){e.preventDefault();clickEl('#e-img')}
  if(e.key=='Escape'&&S.modal)closeModal();
  if(e.key=='Enter'&&t.tagName=='INPUT'&&!['checkbox','radio','range','file','button'].includes(t.type)&&t.closest('#mbox')){e.preventDefault();if(t.id=='m-title'){t.blur()}else if(t.id=='m-year'||t.id=='m-rtitle')rgAdd();else authStep()}
});
function setLogo(opt){
  const i=$('#logoimg'),L=$('#logo a'),id=curId(),T=toneT(id);
  const def=T?(uiLum(T.bg)<.2?'logod.gif':'logo.gif'):({white:'logo.gif',dark:'logod.gif',note:'logon.gif'}[id]||'logo.gif');
  const cus=T&&!opt&&(T.pend?T.pend.url:(T.logo?(S.blob[T.logo]||T.logo):''));
  delete L.dataset.t;i.style.display='';i.classList.toggle('uc',!!cus);
  i.onerror=cus?()=>setLogo(1):()=>{if(!i.src.endsWith('/logo.gif'))i.src='logo.gif';else{i.style.display='none';L.dataset.t='TAKESOUL'}};
  i.src=cus||def;
}
setLogo();
const track=p=>{if(S.lt!=p.id){S.lt=p.id;if(!S.admin)try{gtag('event','view_post',{post_id:p.id,post_title:p.title})}catch(e){}}};
(async()=>{
  if(S.admin){try{const r=await ghRepo(S.key);
    if(r.status==401){keyClear();S.key='';S.admin=false;toast('저장된 키가 만료되어 로그아웃되었습니다.',1)}}catch(e){}}
  await reload();
  showPost(postByHash()||vis()[0]);
  render();
})();
</script>
