async function ghj(path,o){

async function flushNow(msg,prog){
  if(!Q.size)return;
  const items=[...Q],done=()=>items.forEach(([p,v])=>{if(Q.get(p)===v)Q.delete(p)});
  const br=BR||BRN||(BRN=(await ghj('')).default_branch);

  const cm=await ghj(`/git/commits/${head}`);
  const tr=await ghj(`/git/trees/${cm.tree.sha}?recursive=1`);
  const have=new Set((tr.tree||[]).filter(x=>x.type=='blob').map(x=>x.path));
  const adds=items.filter(([,v])=>!v.d),ents=[];let n=0;
  for(const [p,v] of adds){
    if(prog)prog(++n,adds.length,p);
    const bl=await ghj('/git/blobs',{method:'POST',body:JSON.stringify({content:v.b?await b64blob(v.b):b64(v.t),encoding:'base64'})});
    ents.push({path:p,mode:'100644',type:'blob',sha:bl.sha});
  }
  items.forEach(([p,v])=>{if(v.d&&(tr.truncated||have.has(p)))ents.push({path:p,mode:'100644',type:'blob',sha:null})});
  if(!ents.length){done();return}
  const nt=await ghj('/git/trees',{method:'POST',body:JSON.stringify({base_tree:cm.tree.sha,tree:ents})});
  const nc=await ghj('/git/commits',{method:'POST',body:JSON.stringify({message:msg||'update',tree:nt.sha,parents:[head]})});

async function embCover(f){
  if(!/\.mp3$/i.test(f.name))return null;
  try{
    const h=new Uint8Array(await f.slice(0,10).arrayBuffer());
    if(h[0]!=73||h[1]!=68||h[2]!=51)return null;
    const ver=h[3],size=(h[6]<<21)|(h[7]<<14)|(h[8]<<7)|h[9];
    const b=new Uint8Array(await f.slice(0,10+size).arrayBuffer());
    let o=10;
    if(h[5]&0x40)o+=ver==4?((b[10]<<21)|(b[11]<<14)|(b[12]<<7)|b[13]):(((b[10]<<24)|(b[11]<<16)|(b[12]<<8)|b[13])+4);
    const v2=ver==2,hl=v2?6:10;
    while(o+hl<=b.length){
      const id=String.fromCharCode(...b.slice(o,o+(v2?3:4)));
      if(!/^[A-Z0-9]+$/.test(id))break;
      const fs=v2?((b[o+3]<<16)|(b[o+4]<<8)|b[o+5]):ver==4?((b[o+4]<<21)|(b[o+5]<<14)|(b[o+6]<<7)|b[o+7]):(((b[o+4]<<24)|(b[o+5]<<16)|(b[o+6]<<8)|b[o+7])>>>0);
      const d=o+hl;if(fs<=0||d+fs>b.length)break;
      if(id=='APIC'||id=='PIC'){
        const enc=b[d];let i=d+1;
        if(v2)i+=3;else{while(i<d+fs&&b[i]!=0)i++;i++}
        i++;
        if(enc==0||enc==3){while(i<d+fs&&b[i]!=0)i++;i++}else{while(i+1<d+fs&&!(b[i]==0&&b[i+1]==0))i+=2;i+=2}
        const data=b.slice(i,d+fs);
        if(data.length>100)return new Blob([data],{type:data[0]==0xFF?'image/jpeg':data[0]==0x89?'image/png':'application/octet-stream'});
      }
      o=d+fs;
    }
  }catch(e){}
  return null;
}

document.addEventListener('change',async e=>{
  const t=e.target,k=t.dataset&&t.dataset.ui;
  if(t.id=='e-img'){const fs=[...t.files];t.value='';addFiles(fs)}
  else if(t.id=='u-logo'){const f=t.files[0];t.value='';if(f)await uiLogo(f)}
  else if(t.id=='m-up'){
    const all=[...t.files],good=all.filter(f=>/\.(mp3|m4a|ogg)$/i.test(f.name));t.value='';
    const I=S.pend.items;let dup=0,over=0;
    for(const f of good){
      if(I.some(x=>x.f.name==f.name&&x.f.size==f.size)){dup++;continue}
      if(I.length>=30){over++;continue}
      const it={f,title:f.name.replace(/\.[^.]+$/,''),cv:null};I.push(it);
      embCover(f).then(b=>{if(!b||it.cv||!S.pend.items.includes(it))return;it.cv={file:b,url:URL.createObjectURL(b)};
        const bt=$(`[data-a="pqcover"][data-v="${S.pend.items.indexOf(it)}"]`);if(bt)bt.innerHTML=`<img src="${it.cv.url}" alt="">`}).catch(()=>{});
    }
    renderModal();
    const ex=all.length-good.length;
    if(ex||dup||over)msg([ex?`mp3 · m4a · ogg 파일만 올릴 수 있어요 (제외 ${ex}개)`:'',dup?`이미 선택한 파일 ${dup}개는 건너뛰었어요`:'',over?`한 번에 최대 30곡까지만 담을 수 있어요 (제외 ${over}개)`:''].filter(Boolean).join(' · '));
  }
  else if(t.id=='m-acover'){
    const f=t.files[0];t.value='';if(!f)return;
    if(!isImg(f)){msg('이미지 파일을 골라 주세요.');return}
    if(S.mv=='reg'){const yi=$('#m-year'),ti=$('#m-rtitle');if(yi)S.ry=yi.value;if(ti)S.rt=ti.value}
    if(S.ac)revoke(S.ac.url);
    S.ac={file:f,url:URL.createObjectURL(f)};renderModal();
  }
  else if(t.id=='m-cover'){
    const f=t.files[0];t.value='';if(!f)return;
    if(!isImg(f)){msg('이미지 파일을 골라 주세요.');return}
    const it=S.pend.items[S.pqi];if(!it)return;
    if(it.cv)revoke(it.cv.url);
    it.cv={file:f,url:URL.createObjectURL(f)};renderModal();
  }
  else if(k&&k!='ft'&&t.dataset.ik=='t')onDesignChange(t,k);
});

const keyRow=(id,ph)=>{$('#krow').innerHTML=`<span>관리자 모드</span><input id="${id}" type="password" placeholder="${ph}" autocomplete="off"><button data-a="authok">[확인]</button>`;$('#'+id).focus()};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
async function authStep(){
  const pw=$('#pw'),gk=$('#gk');
  if(pw){
    if(await sha(pw.value.trim())!==CFG.gate){msg('코드가 맞지 않습니다.');return}
    keyRow('gk','GitHub 키(토큰)');
    $('#krow').insertAdjacentHTML('afterend','<label class="row2"><span></span><span><input type="checkbox" id="keep">이 기기에서는 유지</span></label>');
  }else if(gk){
    const k=gk.value.replace(/\s/g,'');
    if(!k){msg('키를 입력하세요.');return}
    msg('확인 중… ('+O+'/'+R+')');
    try{
      const r=await ghRepo(k);
      if(!r.ok){msg(`실패(${r.status}): 저장소 ${O}/${R} 또는 키 권한을 확인하세요. 주소가 다르면 코드 상단 CFG에 owner/repo를 적으세요.`);return}
      const j=await r.json();
      if(j.permissions&&j.permissions.push===false){msg('이 키에는 쓰기 권한이 없습니다. (Contents: Read and write 필요)');return}
      S.key=k;keySave(k,$('#keep')&&$('#keep').checked);S.admin=true;closeModal();gaOff();await reload();render();
    }catch(err){msg('오류: '+err.message)}
  }
}
document.addEventListener('keydown',e=>{
  const t=e.target;
  if((e.key=='Enter'||e.key==' ')&&t.id=='dz'){e.preventDefault();clickEl('#e-img')}
  if(e.key=='Escape'&&S.modal)closeModal();
  if(e.key=='Enter'&&t.closest('#mbox')){e.preventDefault();if(t.id=='m-title'){S.mte=false;renderModal()}else if(t.id=='m-year'||t.id=='m-rtitle')rgAdd();else authStep()}
});
function setLogo(opt){
  const i=$('#logoimg'),L=$('#logo a'),id=curId(),T=toneT(id);
  const def=T?(uiLum(T.bg)<.2?'logod.gif':'logo.gif'):({white:'logo.gif',dark:'logod.gif',note:'logon.gif'}[id]||'logo.gif');
  const cus=T&&!opt&&(T.pend?T.pend.url:(T.logo?(S.blob[T.logo]||T.logo):''));
  delete L.dataset.t;i.style.display='';i.classList.toggle('uc',!!cus);
  i.onerror=cus?()=>setLogo(1):()=>{if(!i.src.endsWith('/logo.gif'))i.src='logo.gif';else{i.style.display='none';L.dataset.t='TAKESOUL'}};
  i.src=cus||def;
}
setLogo();
const track=p=>{if(S.lt!=p.id){S.lt=p.id;if(!S.admin)try{gtag('event','view_post',{post_id:p.id,post_title:p.title})}catch(e){}}};
(async()=>{
  if(S.admin){try{const r=await ghRepo(S.key);
    if(r.status==401){keyClear();S.key='';S.admin=false;toast('저장된 키가 만료되어 로그아웃되었습니다.',1)}}catch(e){}}
  await reload();
  showPost(postByHash()||vis()[0]);
  render();
})();
